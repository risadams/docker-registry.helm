name: Release Charts

env:
  HELM_VERSION_TO_INSTALL: 3.21.2
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}

on:
  # Releases when the chart version changes on main; manual runs remain for retries.
  push:
    branches: [main]
    paths:
      - 'Chart.yaml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and lint only; skip releases, index push, and OCI push
        type: boolean
        default: false

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # ci.yaml declares read-all; the caller must grant at least that.
    permissions: read-all
    uses: ./.github/workflows/ci.yaml

  release:
    needs: ci
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      # Immutable releases lock as soon as they are published, so assets must be
      # attached while the release is still a draft. chart-releaser's own
      # `cr upload` creates the release published and then uploads (fails with
      # 422 on immutable repos), so we create/upload/publish with gh instead and
      # use cr only to package and build the index.
      - name: Package charts
        run: cr package

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          helm lint .
          ls -l .cr-release-packages
          echo "Dry run: skipping release, index push, and OCI push."

      - name: Create GitHub releases (draft, upload, publish)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          [ ${#packages[@]} -gt 0 ] || { echo "::error::No chart packages found"; exit 1; }
          for pkg in "${packages[@]}"; do
            version=$(tar -xzOf "$pkg" --wildcards '*/Chart.yaml' | sed -n 's/^version: *//p' | head -n1)
            tag="v${version}"
            state=$(gh release view "$tag" --json isDraft,assets --jq '"\(.isDraft) \(.assets | length)"' 2>/dev/null || echo "missing")
            case "$state" in
              missing)
                gh release create "$tag" "$pkg" --draft --target main --generate-notes --title "$tag"
                gh release edit "$tag" --draft=false
                ;;
              "true "*)
                # Leftover draft from an interrupted run: finish it.
                gh release upload "$tag" "$pkg" --clobber
                gh release edit "$tag" --draft=false
                ;;
              "false 0")
                echo "::error::Release $tag is published with no assets and is immutable. Bump the chart version."
                exit 1
                ;;
              *)
                echo "Release $tag already published with assets; skipping."
                ;;
            esac
          done

      - name: Update Helm repo index
        if: ${{ !inputs.dry_run }}
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          owner=$(cut -d '/' -f 1 <<< "$GITHUB_REPOSITORY")
          repo=$(cut -d '/' -f 2 <<< "$GITHUB_REPOSITORY")
          cr index --owner="$owner" --git-repo "$repo" --token="$CR_TOKEN" --release-name-template="v{{ .Version }}" --packages-with-index --push --index-path="."

      # The index (--packages-with-index) points at the Pages site, so the
      # packages must be on gh-pages too. `cr upload` used to do this; we no
      # longer call it. Idempotent: only adds packages that are missing.
      - name: Publish packages to gh-pages
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages --detach
          cd "$RUNNER_TEMP/gh-pages"
          for pkg in "$GITHUB_WORKSPACE"/.cr-release-packages/*.tgz; do
            [ -e "$(basename "$pkg")" ] || cp "$pkg" .
          done
          git add -- '*.tgz'
          if git diff --cached --quiet; then
            echo "gh-pages already has all packages"
          else
            git commit -m "Add chart packages for ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi

      - name: Install Helm
        if: ${{ !inputs.dry_run }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION_TO_INSTALL }}

      - name: Publish chart to GHCR OCI registry
        if: ${{ !inputs.dry_run }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.repository_owner }}" --password-stdin
          helm package "${{ github.workspace }}/"
          package=$(ls -t docker-registry-*.tgz | head -n 1)
          version=$(sed -n 's/^version: *//p' Chart.yaml | head -n1)
          # Skip if already published so re-runs after a partial failure succeed.
          if helm show chart "oci://${{ env.GHCR_IMAGE }}/docker-registry" --version "${version}" >/dev/null 2>&1; then
            echo "OCI docker-registry ${version} already published; skipping push"
          else
            helm push "${package}" "oci://${{ env.GHCR_IMAGE }}"
          fi

      # Download the chart the way a user would. GitHub Pages can lag the
      # gh-pages push by a few minutes, so retry before failing.
      - name: Verify chart is installable from the Helm repo
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' Chart.yaml | head -n1)
          owner=$(cut -d '/' -f 1 <<< "$GITHUB_REPOSITORY")
          repo=$(cut -d '/' -f 2 <<< "$GITHUB_REPOSITORY")
          url="https://${owner}.github.io/${repo}"
          for attempt in $(seq 1 10); do
            rm -rf "$RUNNER_TEMP/verify"; mkdir -p "$RUNNER_TEMP/verify"
            helm repo add verify-repo "$url" --force-update >/dev/null
            if helm pull verify-repo/docker-registry --version "$version" --destination "$RUNNER_TEMP/verify"; then
              echo "docker-registry ${version} is downloadable from ${url}"
              exit 0
            fi
            echo "Attempt ${attempt}/10 failed; waiting for GitHub Pages..."
            sleep 30
          done
          echo "::error::docker-registry ${version} is not downloadable from ${url}"
          exit 1
